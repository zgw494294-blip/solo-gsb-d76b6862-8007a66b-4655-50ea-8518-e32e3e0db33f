services:
  deadlock-api:
    build: .
    image: deadlock-api:latest
    container_name: deadlock-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
